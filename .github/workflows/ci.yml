name: CI

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  validate:
    name: Lint, build and tests
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-test-secret
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/code_to_block_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: code_to_block_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d code_to_block_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Run unit tests and coverage
        run: npm run test:cov

      - name: Run integration tests
        run: npm run test:integration